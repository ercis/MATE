[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mate-api"
version = "0.1.0"
description = "FastAPI backend for the Mate process analysis platform."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "pm4py>=2.7",
    "lxml>=5.2",
    "python-multipart>=0.0.12",
    "structlog>=24.1",
    "aiofiles>=24.1",
    "httpx>=0.27",
    "watchdog>=5.0",
    "pyjwt[crypto]>=2.9",
    "boto3>=1.34",
    "packaging>=24.0",
    "psutil>=6.0",
    "mate-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
mate-api = "mate.api.cli:main"

[tool.uv.sources]
mate-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mate"]

[tool.hatch.build.targets.sdist]
include = ["src/mate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]
