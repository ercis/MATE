[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-mod-pcomp"
version = "0.2.0"
requires-python = "==3.12.*"
dependencies = [
    "pcomp @ git+https://github.com/cpitsch/pcomp.git",
    "wasserstein>=1.1.0",
    "strsimpy>=0.2.1",
    "scipy>=1.12.0,<1.14.0",
    "pot>=0.9.2",
    "pathos>=0.3.2",
    "rustxes>=0.2.2",
    "scikit-learn>=1.3.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
