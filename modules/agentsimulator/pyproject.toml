[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-mod-agentsimulator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scipy==1.13.1",
    "Mesa==2.1.2",
    "networkx==3.2.1",
    "pm4py==2.7.11.13",
    "polars==0.20.16",
    "pytz==2024.1",
    "lxml==5.3.0",
    "python-dateutil==2.9.0.post0",
    "tqdm==4.66.5",
    "pyarrow==17.0.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
