[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ff-mod-concept-drift-explainer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.5,<0.7",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-text-splitters>=0.3",
    "openai>=1.40",
    "pinecone>=7.0",
    "tiktoken>=0.9",
    "pypdf>=5.0",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "nltk>=3.9",
    "Pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
