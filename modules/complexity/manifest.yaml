id: complexity
name: Complexity
version: 1.0.0
category: advanced
description: >-
  Measures how complex your process is with entropy-based metrics over its
  variants and activity sequences, plus Lempel-Ziv, affinity, structure, and
  Pentland's task and process complexity. Uses richer XES trace and event
  attributes automatically when they are present. Based on Augusto et al., "The
  connection between process complexity of event sequences and models discovered
  by process mining" (2022). DOI: https://doi.org/10.1016/j.ins.2022.03.072
about: >-
  Put a number on how tangled your process is: this module scores your log with
  entropy, Lempel-Ziv, affinity, structure, and Pentland complexity metrics. Use
  it to compare processes or process versions objectively, spot logs that will
  produce unreadable spaghetti models before you discover them, and track
  whether standardization efforts actually reduced variability.
keywords: ["complexity", "entropy", "variant entropy", "lempel-ziv", "pentland", "structure", "affinity", "epa"]
source:
  - title: >-
      The connection between process complexity of event sequences and models
      discovered by process mining
    fullCitation: >-
      A. Augusto, J. Mendling, M. Vidgof, and B. Wurm, "The connection between
      process complexity of event sequences and models discovered by process
      mining," Inf. Sci., vol. 598, pp. 196-215, 2022
    url: https://doi.org/10.1016/j.ins.2022.03.072
license: MIT
default_enabled: true
# Runs entirely locally – safe to use against confidential event logs.
isConfidentialSafe: true

requirements:
  event_log:
    # Case-centric: runs on a classic event log (one case per trace). Never
    # appears for object-centric (OCEL) logs.
    log_model: case_centric
    required_columns:
      - case_id
      - activity
      - timestamp
    min_events: 50
    min_cases: 2

provides:
  - complexity.metrics
  - complexity.enriched

consumes:
  - log.imported

dependencies:
  python:
    requires-python: ">=3.12"
    packages: []
    inherit:
      - pm4py
      - pandas
      - duckdb
    isolation: in_process
    # Precompute runs in a killable child process so Cancel/shutdown stop it.
    execution: worker

frontend:
  panel: ./panel/index.tsx
  widgets:
    - id: complexity-metrics
      entry: ./widgets/ComplexityMetrics.tsx
      title: Complexity metrics
      description: Headline EPA-based measures - magnitude, variety, entropy, Lempel–Ziv.
      icon: Layers
      # Metric scorecard (8 tiles): min sized to show them all.
      default_w: 4
      default_h: 15
      min_w: 3
      min_h: 6
      # Ids match FIGURES in widgets/ComplexityMetrics.tsx and the keys in
      # panel/metric-info, so a card's ⓘ cites the same source as the panel.
      kpis:
        - { id: magnitude, title: Magnitude, info: Number of events in the log. }
        - { id: variety, title: Variety, info: Number of distinct activities. }
        - { id: distinct_traces_pct, title: Distinct traces, info: Share of cases whose path is unique. }
        - { id: trace_length, title: Avg trace length }
        - { id: variant_entropy, title: Variant entropy, info: How unpredictable the mix of paths is. }
        - { id: sequence_entropy, title: Sequence entropy, default: false }
        - { id: lempel_ziv, title: Lempel-Ziv, default: false }
        - { id: pentland_process, title: Pentland process complexity, default: false }
      min_px_w: 300
      min_px_h: 360
      help:
        what: "How structurally complicated the process is, as a set of established complexity measures."
        read: "Higher generally means harder to understand and to standardise. The measures disagree by design — they capture different kinds of complexity."
        computed: "Computed over the filtered log; see the module page for each measure's definition."
    - id: entropy-comparison
      entry: ./widgets/EntropyComparison.tsx
      title: Entropy comparison
      description: Normalized variant vs sequence entropy (incl. forgetting).
      icon: BarChart3
      default_w: 3
      default_h: 8
      min_w: 3
      min_h: 6
      min_px_w: 300
      min_px_h: 220
      help:
        what: "Variation in the process, compared across entropy-based measures."
        read: "Higher entropy means less predictable behaviour — more distinct paths carrying meaningful share."
        computed: "Entropy over the log's variant distribution."
# Data-only output for the platform's generic visualization layer.
datasets:
  - id: metrics
    title: Complexity metrics
    description: Headline EPA-based complexity measures (magnitude, variety, entropy, Lempel-Ziv).
    icon: Layers
    shape: kpi
    route: /metrics

permissions:
  - read:event_log
  - write:module_results

config_schema:
  properties:
    exponential_k:
      type: number
      title: Exponential forgetting k
      description: Coefficient k for the exponential-forgetting sequence entropy term. The original paper uses k=1.
      minimum: 0.1
      maximum: 10.0
      step: 0.1
      default: 1.0
      ui:
        widget: number
        affects: compute
