id: log_evolution
name: Log Evolution
version: 1.0.0
category: advanced
description: >-
  Shows how your log grows and shifts over time: case arrivals versus
  completions, work in progress, the changing activity mix, and a dotted chart
  of every event. Makes growth, backlogs, seasonality, and drift easy to spot.
about: >-
  See how your log grows and shifts over time: case arrivals versus completions,
  work in progress, the changing activity mix, and a dotted chart of every
  single event. Use it to spot growing backlogs, seasonality, and creeping
  behaviour changes - or to check whether a process redesign actually changed
  how work arrives and gets done.
keywords: ["log evolution", "over time", "case arrivals", "work in progress", "wip", "dotted chart", "backlog", "seasonality"]
license: MIT
default_enabled: true
# Runs entirely locally – safe to use against confidential event logs.
isConfidentialSafe: true

requirements:
  event_log:
    # Case-centric: runs on a classic event log (one case per trace). Never
    # appears for object-centric (OCEL) logs.
    log_model: case_centric
    required_columns:
      - case_id
      - activity
      - timestamp
    optional_columns:
      - end_timestamp
    min_events: 50
    min_cases: 2

provides:
  - log_evolution.timeseries

consumes:
  - log.imported

dependencies:
  python:
    requires-python: ">=3.12"
    packages: []
    inherit:
      - pandas
    isolation: in_process
    # Precompute runs in a killable child process so Cancel/shutdown stop it.
    execution: worker

frontend:
  panel: ./panel/index.tsx
  widgets:
    - id: arrivals-completions
      entry: ./widgets/ArrivalsCompletions.tsx
      title: Arrivals & completions
      description: Cases started vs. completed per period - growth, backlog and seasonality.
      icon: TrendingUp
      default_w: 4
      default_h: 7
      min_w: 3
      min_h: 7
      config_schema:
        properties:
          granularity:
            type: string
            title: Granularity
            description: Calendar period each point aggregates.
            default: auto
            enum: [auto, daily, weekly, monthly, quarterly, yearly]
            enumLabels: [Auto, Daily, Weekly, Monthly, Quarterly, Yearly]
            ui:
              widget: select
      min_px_w: 320
      min_px_h: 220
      help:
        what: "Cases starting and finishing over time."
        read: "When arrivals persistently exceed completions the process is accumulating work in progress."
        computed: "Bucketed by the chosen granularity over the filtered log."
    - id: active-cases
      entry: ./widgets/ActiveCases.tsx
      title: Active cases (WIP)
      description: Open cases (started but not finished) at the end of each period.
      icon: Activity
      default_w: 3
      default_h: 7
      min_w: 3
      min_h: 7
      config_schema:
        properties:
          granularity:
            type: string
            title: Granularity
            default: auto
            enum: [auto, daily, weekly, monthly, quarterly, yearly]
            enumLabels: [Auto, Daily, Weekly, Monthly, Quarterly, Yearly]
            ui:
              widget: select
      min_px_w: 300
      min_px_h: 200
      help:
        what: "How many cases are open at each point in time."
        read: "A rising line means work is arriving faster than it clears. Steady means arrivals and completions are balanced."
        computed: "A case counts as active between its first and last event."
    - id: activity-mix
      entry: ./widgets/ActivityMix.tsx
      title: Activity mix over time
      description: Stacked event volume per activity per period - which activities dominate when.
      icon: Layers
      default_w: 4
      default_h: 7
      min_w: 3
      min_h: 7
      config_schema:
        properties:
          granularity:
            type: string
            title: Granularity
            default: auto
            enum: [auto, daily, weekly, monthly, quarterly, yearly]
            enumLabels: [Auto, Daily, Weekly, Monthly, Quarterly, Yearly]
            ui:
              widget: select
          top_n:
            type: integer
            title: Activities shown
            description: Top activities kept as their own band; the rest fold into "Other".
            minimum: 2
            maximum: 12
            step: 1
            default: 8
            ui:
              widget: slider
      min_px_w: 320
      min_px_h: 240
      help:
        what: "How the balance of activities changes over time."
        read: "A band that grows or vanishes marks a change in how the process is actually run — often a process change, sometimes a recording change."
        computed: "Share of events per activity per period, top N by total volume."
    - id: dotted-chart
      entry: ./widgets/DottedChart.tsx
      title: Dotted chart
      description: One dot per event - x = time, y = case (ordered by start), colour = activity.
      icon: ScatterChart
      default_w: 4
      default_h: 9
      min_w: 3
      min_h: 8
      config_schema:
        properties:
          max_points:
            type: integer
            title: Max points
            description: Events are down-sampled above this to keep the chart responsive.
            minimum: 500
            maximum: 20000
            step: 500
            default: 8000
            ui:
              widget: slider
      min_px_w: 340
      min_px_h: 260
      help:
        what: "Every event plotted over time — the classic dotted chart."
        read: "Diagonal bands are cohorts moving through together; vertical stripes are batch processing."
        computed: "One dot per event, sampled down to the configured maximum for legibility."
permissions:
  - read:event_log
  - write:module_results
